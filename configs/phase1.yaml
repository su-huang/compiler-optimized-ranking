# Phase 1 fine-tuning config — cross-encoder pairwise ranker
model_name: distilbert-base-uncased
num_labels: 2
max_length: 256

max_pairs_per_user: 20
train_frac: 0.8
val_frac: 0.1
# remaining fraction goes to test

# sized for local M4 Mac Pro (CPU/MPS); adjust based on observed memory usage
batch_size: 16
eval_batch_size: 32
learning_rate: 2e-5
num_epochs: 3
seed: 42

output_dir: checkpoints/phase1
