apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranking-api
  labels:
    app: ranking-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ranking-api
  template:
    metadata:
      labels:
        app: ranking-api
    spec:
      containers:
        - name: ranking-api
          image: ranking-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            # torch.compile's Inductor backend spins up a C++ compile at startup on
            # top of two loaded models (stable + canary) -- the original 1Gi limit
            # (sized before COMPILE_MODEL existed) OOMKilled the pod (exit 137)
            # during warmup. Bumped after observing the actual failure, not guessed.
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          # torch.compile warmup (COMPILE_MODEL=true by default) runs during FastAPI's
          # lifespan startup, before the app accepts any connections -- took ~9s
          # locally, can be longer under the 250m CPU request below, so probes get
          # extra initial delay rather than generating startup noise/restarts.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ranking-api
  labels:
    app: ranking-api
spec:
  selector:
    app: ranking-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
